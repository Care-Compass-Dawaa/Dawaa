AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Dawaa backend — pharmacy search, auth, inventory, and pharmacy management.

Globals:
  Function:
    Runtime: java21
    MemorySize: 512
    Timeout: 15
    Architectures:
      - x86_64
    Environment:
      Variables:
        GOOGLE_MAPS_API_KEY: ""          # Set via sam deploy --parameter-overrides
        USERS_TABLE:      !Ref UsersTable
        INVENTORY_TABLE:  !Ref InventoryTable
        PHARMACIES_TABLE: !Ref PharmaciesTable

# ─── Parameters ───────────────────────────────────────────────────────────────
Parameters:
  GoogleMapsApiKey:
    Type: String
    Default: ""
    Description: Google Maps Places API key used by the pharmacy search function.

# ─── Resources ────────────────────────────────────────────────────────────────
Resources:

  # ── DynamoDB Tables ──────────────────────────────────────────────────────────

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DawaaUsers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  InventoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DawaaInventory
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: pharmacistId
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: pharmacistId-index
          KeySchema:
            - AttributeName: pharmacistId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  PharmaciesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DawaaPharmacies
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: pharmacistId
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: pharmacistId-index
          KeySchema:
            - AttributeName: pharmacistId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # ── Lambda Functions ─────────────────────────────────────────────────────────

  SearchPharmaciesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.dawaa.pharmacies.SearchPharmaciesHandler::handleRequest
      Description: Searches nearby pharmacies via Google Places API.
      Environment:
        Variables:
          GOOGLE_MAPS_API_KEY: !Ref GoogleMapsApiKey
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        SearchPharmacies:
          Type: Api
          Properties:
            Path: /pharmacies/search
            Method: post

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.dawaa.auth.AuthHandler::handleRequest
      Description: Handles user registration and login.
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !GetAtt UsersTable.Arn
                - !Sub "${UsersTable.Arn}/index/email-index"
      Events:
        Register:
          Type: Api
          Properties:
            Path: /auth/register
            Method: post
        Login:
          Type: Api
          Properties:
            Path: /auth/login
            Method: post

  InventoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.dawaa.inventory.InventoryHandler::handleRequest
      Description: CRUD for pharmacist medicine inventory.
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:DeleteItem
                - dynamodb:Query
              Resource:
                - !GetAtt InventoryTable.Arn
                - !Sub "${InventoryTable.Arn}/index/pharmacistId-index"
      Events:
        ListInventory:
          Type: Api
          Properties:
            Path: /inventory/{pharmacistId}
            Method: get
        UpsertInventory:
          Type: Api
          Properties:
            Path: /inventory
            Method: post
        DeleteInventory:
          Type: Api
          Properties:
            Path: /inventory/{id}
            Method: delete

  PharmacyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.dawaa.pharmacies.PharmacyHandler::handleRequest
      Description: Pharmacy registration and admin management.
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !GetAtt PharmaciesTable.Arn
                - !Sub "${PharmaciesTable.Arn}/index/pharmacistId-index"
      Events:
        RegisterPharmacy:
          Type: Api
          Properties:
            Path: /pharmacies
            Method: post
        GetMyPharmacy:
          Type: Api
          Properties:
            Path: /pharmacies/mine
            Method: get
        AdminListPharmacies:
          Type: Api
          Properties:
            Path: /admin/pharmacies
            Method: get
        AdminApprovePharmacy:
          Type: Api
          Properties:
            Path: /admin/pharmacies/{id}/approve
            Method: post

# ─── Outputs ──────────────────────────────────────────────────────────────────
Outputs:
  ApiBaseUrl:
    Description: API Gateway base URL — set this as DAWAA_API_BASE_URL in your frontend .env
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"

  UsersTableName:
    Description: DynamoDB Users table name
    Value: !Ref UsersTable

  InventoryTableName:
    Description: DynamoDB Inventory table name
    Value: !Ref InventoryTable

  PharmaciesTableName:
    Description: DynamoDB Pharmacies table name
    Value: !Ref PharmaciesTable
