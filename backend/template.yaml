AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Dawaa backend - medicine, users, inventory, and pharmacy APIs.

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - W1028

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization,X-Dawaa-User-Id'"
      AllowOrigin: "'*'"
  Function:
    Runtime: java21
    MemorySize: 512
    Timeout: 15
    Architectures:
      - x86_64

Parameters:
  UsersTableName:
    Type: String
    Default: DawaaUsers
    Description: Existing DynamoDB users table name used by auth.

  InventoryTableName:
    Type: String
    Default: DawaaInventory
    Description: Existing DynamoDB inventory table name used by inventory.

  PharmaciesTableName:
    Type: String
    Default: DawaaPharmacies
    Description: Existing DynamoDB pharmacies table name used by pharmacy management.

  MedicinesTableName:
    Type: String
    Default: DawaaMedicines
    Description: Existing DynamoDB medicines table name used for medicine lookup.

  OpenRouteServiceApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional OpenRouteService API key used for route-aware pharmacy ranking.

Resources:
  MedicineLookupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.dawaa.api.medicine.MedicineLookupHandler::handleRequest
      Description: Looks up active medicines by brand or generic name.
      Environment:
        Variables:
          MEDICINES_TABLE: !Ref MedicinesTableName
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MedicinesTableName}"
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MedicinesTableName}/index/BrandNameIndex"
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MedicinesTableName}/index/GenericNameIndex"
      Events:
        SearchMedicines:
          Type: Api
          Properties:
            Path: /medicines/search
            Method: get
        SuggestMedicines:
          Type: Api
          Properties:
            Path: /medicines/suggestions
            Method: get

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.dawaa.api.auth.AuthHandler::handleRequest
      Description: User registration and login.
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTableName
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:Query
              Resource:
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UsersTableName}"
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UsersTableName}/index/email-index"
      Events:
        Register:
          Type: Api
          Properties:
            Path: /auth/register
            Method: post
        Login:
          Type: Api
          Properties:
            Path: /auth/login
            Method: post

  UserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.dawaa.api.user.UserHandler::handleRequest
      Description: Current user profile lookup, update, and self-deactivation.
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTableName
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource:
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UsersTableName}"
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UsersTableName}/index/email-index"
      Events:
        GetMe:
          Type: Api
          Properties:
            Path: /users/me
            Method: get
        UpdateMe:
          Type: Api
          Properties:
            Path: /users/me/update
            Method: post
        DeactivateMe:
          Type: Api
          Properties:
            Path: /users/me
            Method: delete

  AdminUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.dawaa.api.user.AdminHandler::handleRequest
      Description: Admin user listing, lookup, and deactivation.
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTableName
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UsersTableName}"
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UsersTableName}/index/email-index"
      Events:
        AdminListUsers:
          Type: Api
          Properties:
            Path: /admin/users
            Method: get
        AdminGetUser:
          Type: Api
          Properties:
            Path: /admin/users/{id}
            Method: get
        AdminGetUserByEmail:
          Type: Api
          Properties:
            Path: /admin/users/by-email
            Method: get
        AdminDeactivateUser:
          Type: Api
          Properties:
            Path: /admin/users/{id}
            Method: delete

  InventoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.dawaa.api.inventory.InventoryAvailabilityHandler::handleRequest
      Description: Looks up pharmacy inventory availability by medicine id.
      Environment:
        Variables:
          INVENTORY_TABLE: !Ref InventoryTableName
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${InventoryTableName}"
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${InventoryTableName}/index/MedicineAvailabilityIndex"
      Events:
        LookupInventoryAvailability:
          Type: Api
          Properties:
            Path: /inventory/availability
            Method: get

  InventoryCrudFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.dawaa.api.inventory.InventoryHandler::handleRequest
      Description: Pharmacist inventory listing, create/update, and deletion.
      Environment:
        Variables:
          INVENTORY_TABLE: !Ref InventoryTableName
          PHARMACIES_TABLE: !Ref PharmaciesTableName
          USERS_TABLE: !Ref UsersTableName
          MEDICINES_TABLE: !Ref MedicinesTableName
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
                - dynamodb:Query
              Resource:
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${InventoryTableName}"
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UsersTableName}"
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PharmaciesTableName}/index/PharmacyOwnerIndex"
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MedicinesTableName}"
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MedicinesTableName}/index/BrandNameIndex"
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MedicinesTableName}/index/GenericNameIndex"
      Events:
        ListInventory:
          Type: Api
          Properties:
            Path: /inventory/{id}
            Method: get
        UpsertInventory:
          Type: Api
          Properties:
            Path: /inventory
            Method: post
        DeleteInventory:
          Type: Api
          Properties:
            Path: /inventory/{id}
            Method: delete

  PharmacyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.dawaa.api.pharmacy.PharmacyHandler::handleRequest
      Description: Pharmacy registration, admin management, and nearby lookup.
      Environment:
        Variables:
          PHARMACIES_TABLE: !Ref PharmaciesTableName
          USERS_TABLE: !Ref UsersTableName
          INVENTORY_TABLE: !Ref InventoryTableName
          OPENROUTESERVICE_API_KEY: !Ref OpenRouteServiceApiKey
          OPENROUTESERVICE_PROFILE: driving-car
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PharmaciesTableName}"
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PharmaciesTableName}/index/PharmacyOwnerIndex"
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UsersTableName}"
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${InventoryTableName}"
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${InventoryTableName}/index/MedicineAvailabilityIndex"
      Events:
        RegisterPharmacy:
          Type: Api
          Properties:
            Path: /pharmacies
            Method: post
        GetMyPharmacy:
          Type: Api
          Properties:
            Path: /pharmacies/mine
            Method: get
        GetPublicPharmacy:
          Type: Api
          Properties:
            Path: /pharmacies/{id}
            Method: get
        AdminListPharmacies:
          Type: Api
          Properties:
            Path: /admin/pharmacies
            Method: get
        AdminGetPharmacy:
          Type: Api
          Properties:
            Path: /admin/pharmacies/{id}
            Method: get
        AdminApprovePharmacy:
          Type: Api
          Properties:
            Path: /admin/pharmacies/{id}/approve
            Method: post
        NearbyPharmacies:
          Type: Api
          Properties:
            Path: /pharmacies/nearby
            Method: get
        SearchPharmacies:
          Type: Api
          Properties:
            Path: /pharmacies/search
            Method: post

  RouteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.dawaa.api.route.RouteHandler::handleRequest
      Description: Route directions lookup through OpenRouteService.
      Environment:
        Variables:
          OPENROUTESERVICE_API_KEY: !Ref OpenRouteServiceApiKey
          OPENROUTESERVICE_PROFILE: driving-car
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        RouteDirections:
          Type: Api
          Properties:
            Path: /routes/directions
            Method: post

Outputs:
  ApiBaseUrl:
    Description: API Gateway base URL - set this as DAWAA_API_BASE_URL in your frontend .env
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"

  MedicinesTableName:
    Description: Existing DynamoDB medicines table name
    Value: !Ref MedicinesTableName

  UsersTableName:
    Description: Existing DynamoDB users table name
    Value: !Ref UsersTableName

  InventoryTableName:
    Description: Existing DynamoDB inventory table name
    Value: !Ref InventoryTableName

  PharmaciesTableName:
    Description: Existing DynamoDB pharmacies table name
    Value: !Ref PharmaciesTableName
