AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Dawaa backend - medicine lookup, with legacy functions disabled by default.

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - W1028

Globals:
  Function:
    Runtime: java21
    MemorySize: 512
    Timeout: 15
    Architectures:
      - x86_64

Parameters:
  DeployLegacyFunctions:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Set to true only when legacy auth, inventory, pharmacy, and nearby-search functions are ready to deploy.

  GoogleMapsApiKey:
    Type: String
    Default: ""
    Description: Google Maps Places API key used by the legacy pharmacy search function.

  UsersTableName:
    Type: String
    Default: DawaaUsers
    Description: Existing DynamoDB users table name used by legacy auth.

  InventoryTableName:
    Type: String
    Default: DawaaInventory
    Description: Existing DynamoDB inventory table name used by legacy inventory.

  PharmaciesTableName:
    Type: String
    Default: DawaaPharmacies
    Description: Existing DynamoDB pharmacies table name used by legacy pharmacy management.

  MedicinesTableName:
    Type: String
    Default: DawaaMedicines
    Description: Existing DynamoDB medicines table name used for medicine lookup.

Conditions:
  DeployLegacyFunctionsCondition: !Equals [!Ref DeployLegacyFunctions, "true"]

Resources:
  MedicineLookupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.dawaa.api.medicine.MedicineLookupHandler::handleRequest
      Description: Looks up active medicines by brand name.
      Environment:
        Variables:
          MEDICINES_TABLE: !Ref MedicinesTableName
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MedicinesTableName}"
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MedicinesTableName}/index/BrandNameIndex"
      Events:
        SearchMedicines:
          Type: Api
          Properties:
            Path: /medicines/search
            Method: get

  SearchPharmaciesFunction:
    Type: AWS::Serverless::Function
    Condition: DeployLegacyFunctionsCondition
    Properties:
      CodeUri: .
      Handler: com.dawaa.pharmacies.SearchPharmaciesHandler::handleRequest
      Description: Legacy nearby pharmacy search via Google Places API.
      Environment:
        Variables:
          GOOGLE_MAPS_API_KEY: !Ref GoogleMapsApiKey
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        SearchPharmacies:
          Type: Api
          Properties:
            Path: /pharmacies/search
            Method: post

  AuthFunction:
    Type: AWS::Serverless::Function
    Condition: DeployLegacyFunctionsCondition
    Properties:
      CodeUri: .
      Handler: com.dawaa.auth.AuthHandler::handleRequest
      Description: Legacy user registration and login.
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTableName
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UsersTableName}"
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UsersTableName}/index/email-index"
      Events:
        Register:
          Type: Api
          Properties:
            Path: /auth/register
            Method: post
        Login:
          Type: Api
          Properties:
            Path: /auth/login
            Method: post

  InventoryFunction:
    Type: AWS::Serverless::Function
    Condition: DeployLegacyFunctionsCondition
    Properties:
      CodeUri: .
      Handler: com.dawaa.inventory.InventoryHandler::handleRequest
      Description: Legacy CRUD for pharmacist medicine inventory.
      Environment:
        Variables:
          INVENTORY_TABLE: !Ref InventoryTableName
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:DeleteItem
                - dynamodb:Query
              Resource:
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${InventoryTableName}"
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${InventoryTableName}/index/pharmacistId-index"
      Events:
        ListInventory:
          Type: Api
          Properties:
            Path: /inventory/{pharmacistId}
            Method: get
        UpsertInventory:
          Type: Api
          Properties:
            Path: /inventory
            Method: post
        DeleteInventory:
          Type: Api
          Properties:
            Path: /inventory/{id}
            Method: delete

  PharmacyFunction:
    Type: AWS::Serverless::Function
    Condition: DeployLegacyFunctionsCondition
    Properties:
      CodeUri: .
      Handler: com.dawaa.pharmacies.PharmacyHandler::handleRequest
      Description: Legacy pharmacy registration and admin management.
      Environment:
        Variables:
          PHARMACIES_TABLE: !Ref PharmaciesTableName
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PharmaciesTableName}"
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PharmaciesTableName}/index/pharmacistId-index"
      Events:
        RegisterPharmacy:
          Type: Api
          Properties:
            Path: /pharmacies
            Method: post
        GetMyPharmacy:
          Type: Api
          Properties:
            Path: /pharmacies/mine
            Method: get
        AdminListPharmacies:
          Type: Api
          Properties:
            Path: /admin/pharmacies
            Method: get
        AdminApprovePharmacy:
          Type: Api
          Properties:
            Path: /admin/pharmacies/{id}/approve
            Method: post

Outputs:
  ApiBaseUrl:
    Description: API Gateway base URL - set this as DAWAA_API_BASE_URL in your frontend .env
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"

  MedicinesTableName:
    Description: Existing DynamoDB medicines table name
    Value: !Ref MedicinesTableName

  UsersTableName:
    Description: Existing DynamoDB users table name
    Value: !Ref UsersTableName

  InventoryTableName:
    Description: Existing DynamoDB inventory table name
    Value: !Ref InventoryTableName

  PharmaciesTableName:
    Description: Existing DynamoDB pharmacies table name
    Value: !Ref PharmaciesTableName
